sonar.projectKey=spora-ai_spora-plugin-team-graph
sonar.organization=spora-ai

# Sources and tests
# `routes` is a source dir, not a test dir: routes/team-graph.php is real PHP
# on the request surface (route path + middleware list), and phpstan.neon
# already analyses it. Leaving it out of `sonar.sources` would put it outside
# the "new code" scope entirely, so a future PR editing only that file would
# report zero findings and silently skip the gate.
sonar.sources=src,routes
sonar.tests=tests
sonar.test.inclusions=**/*Test.php,**/*.Test.php
sonar.exclusions=vendor/**,storage/**

# PHP test coverage (clover XML produced by the `coverage` CI job). The
# measured set comes from phpunit.xml's `<source>` block, which lists the
# same two directories as `sonar.sources` above — keep them in step.
sonar.php.coverage.reportPaths=coverage.xml

# 30-day leak period so the "Sonar way" gate's `new_*` metrics compute on
# projects with no previous-version baseline. Mirrors spora-core's setting.
sonar.leak.period=30
